name: Offline contracts and Codex installation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline checks and isolated installation
        run: python -B scripts/run_offline_regression.py --output tests/results/ci
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-${{ matrix.os }}-py${{ matrix.python }}
          path: tests/results/ci/
          retention-days: 14
