# 心血管领域检索式骨架（默认模板，非可直接使用的检索式）
#
# 用途：为心血管相关主题（他汀类药物、抗血小板治疗、血压控制目标、心衰、房颤等）提供检索式结构起点。
# 占位符（用 <> 标注的部分）需要按实际研究主题替换，不要直接照抄示例词组当作检索结果。

domain: cardiovascular
common_subtopics:
  - statins_lipid_lowering
  - antiplatelet_anticoagulant_therapy
  - blood_pressure_targets
  - heart_failure
  - atrial_fibrillation

query_skeleton:
  subtopic: "<从上面common_subtopics中选择，或填写实际子主题>"
  mesh_candidates: []   # 检索前用可用的 PubMed/MeSH 工具生成，不要预先编造 MeSH 词
  free_text_terms: []   # 填写用户实际使用的自由词
  boolean_structure: >
    (population terms) AND (intervention/exposure terms) AND (outcome terms)
    AND (study design filter, 如 randomized controlled trial[pt])
  notes: "实际检索式需在执行 PubMed 检索后回填到 templates/data/search-protocol.yaml 的
    boolean_query_templates 字段，此文件只提供结构参考。"
