# 肿瘤领域检索式骨架（默认模板，非可直接使用的检索式）
#
# 用途：为肿瘤相关主题（辅助化疗、免疫治疗生物标志物、靶向治疗耐药、新辅助免疫治疗、MRD指导治疗等）
# 提供检索式结构起点。占位符需按实际研究主题替换。

domain: oncology
common_subtopics:
  - adjuvant_chemotherapy
  - immunotherapy_biomarkers
  - targeted_therapy_resistance
  - neoadjuvant_ici
  - mrd_guided_therapy

query_skeleton:
  subtopic: "<从上面common_subtopics中选择，或填写实际子主题>"
  mesh_candidates: []   # 检索前用可用的 PubMed/MeSH 工具生成
  free_text_terms: []
  boolean_structure: >
    (cancer type/population terms) AND (intervention terms) AND (outcome/biomarker terms)
    AND (study design filter)
  notes: "实际检索式需在执行 PubMed 检索后回填到 templates/data/search-protocol.yaml，此文件
    只提供结构参考，不含预先编造的检索式或结果数。"
