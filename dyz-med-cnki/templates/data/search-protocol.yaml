# PRISMA-S 检索方法学骨架（默认模板）
#
# 用途：dyz-med-cnki 在执行可复现检索时参照此文件构建检索式、记录过滤条件。
# 这是一份骨架，不含任何真实检索式——请按你所在项目的实际
# PICO/PCC 和检索范围填写，不要照抄骨架里的占位符示例直接使用。
#
# 若项目已有经过审核的检索协议，以项目版本为准；本文件仅提供一个合理起点。

protocol_version: "1.0"
last_updated: "<YYYY-MM-DD，填写本次更新日期>"

# --- PICO / PCC 要素（对应 dyz-med-init 或 project-passport.yaml 中已确定的研究问题） ---
pico:
  population: "<目标人群，例如：成年2型糖尿病患者>"
  intervention: "<干预/暴露，例如：SGLT2抑制剂>"
  comparator: "<对照，例如：安慰剂或常规治疗，系统综述外的选题可留空>"
  outcome: "<主要结局，例如：主要不良心血管事件>"
  study_design_filter: "<允许的研究设计，例如：RCT、队列研究，按需填写>"

# --- 检索范围限定 ---
scope:
  date_range: "<起始年-结束年，例如：2015-2026，说明理由（如指南更新周期）>"
  languages: ["English"]   # 如需覆盖中文文献，追加 "Chinese" 并注明仅作线索发现
  species_filter: "human"  # 或 animal / both，视研究类型而定
  publication_types_excluded: ["Comment", "Editorial"]  # 按需增删

# --- MeSH 扩展记录（每次检索前用当前环境可用的 PubMed/MeSH 工具生成，填入实际结果） ---
mesh_expansion:
  - free_text_term: "<用户原始关键词>"
    mesh_descriptor: "<对应MeSH主题词，检索后填写，不要预先编造>"
    entry_terms: []

# --- 布尔检索式骨架（按数据库分别记录实际执行的检索式，检索后填入，不要预先编造检索结果数） ---
boolean_query_templates:
  pubmed: "<执行 PubMed 检索后，把实际使用的检索式粘贴于此>"
  google_scholar: "<实际使用的Google Scholar检索关键词组合>"
  chinese_discovery: "<用于中文文献线索发现的网页搜索关键词，注明这是discovery_only，非结构化检索式>"

# --- 去重规则（多来源合并时使用） ---
deduplication_rules:
  primary_keys: ["DOI", "PMID"]
  fallback_keys: ["title_normalized", "year", "first_author_surname"]

# --- PRISMA-S 条目对照（如项目采用PRISMA-S报告体系，检索完成后逐项标注是否已覆盖） ---
prisma_s_checklist:
  S1_multiple_databases: "<是否检索了多个数据库，说明具体是哪些>"
  S2_full_search_strategy: "<完整检索式是否已存档，存档路径>"
  S3_limits_and_restrictions: "<日期/语种/研究类型限制是否已明确记录>"
  S4_search_dates: "<每个数据库的检索日期>"
  S5_pico_pcc_elements: "<检索式与PICO/PCC要素的对应关系是否清晰>"
  S6_search_updates: "<是否有二次检索/更新检索，日期>"
  S7_peer_review_of_search: "<检索策略是否经过同行或第二人复核>"
  S8_supplementary_methods: "<引文追溯、专家咨询等补充方法是否记录>"
  S9_total_records: "<各数据库检索到的总记录数>"
  S10_deduplication_method: "<去重方法与去重后记录数>"
  S11_cited_but_not_retrieved: "<是否有被引用但未能获取全文的记录，说明处理方式>"
